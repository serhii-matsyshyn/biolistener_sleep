# Reward ablation: drowsiness biomarkers only (no PLV, no descent).
#
# Δ(θ/α) + sustained (θ/α − baseline)+ + Δ hypnoθ. No entrainment bonus
# means the policy has no anchor between strobe frequency and reward.
#
# Run via:
#   biolistener-sleep train --config configs/ablation_theta_alpha_delta.yaml \
#     --set training.seed=<N>

training:
  total_steps: 30000               # 5-min episodes -> ~25 episodes per seed
  episode_s: 300
  learning_rate: 3.0e-4
  batch_size: 128
  buffer_size: 50000
  seed: 1
  n_envs: 8

env:
  episode_s: 300
  include_restfulness: false

reward:
  variant: theta_alpha_delta

mlflow:
  experiment_name: reward_ablation_5min
