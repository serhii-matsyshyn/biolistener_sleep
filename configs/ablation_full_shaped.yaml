# Reward ablation: the FULL_SHAPED reward - biomarker terms
# + band-weighted PLV + descent shaping. Current production default.
#
# EXPECTED BEHAVIOUR: ramps the strobe α -> θ over 4-5 min as the brain
# follows; high entrainment fidelity in the sleep-conducive bands; no
# parking at α. Its descent is not separable from the biomarker-only
# variant at this budget.
#
# Episode length is 300 simulated seconds, a window onto a longer
# transition rather than a calibrated sleep-onset latency.
#
# Run via:
#   biolistener-sleep train --config configs/ablation_full_shaped.yaml \
#     --set training.seed=<N>

training:
  total_steps: 300000              # 250 episodes per seed; all four variants
                                   # share this budget
  episode_s: 300                   # simulated seconds, not clock-calibrated
  learning_rate: 3.0e-4
  batch_size: 128
  buffer_size: 150000              # 50 % of the budget, held constant across variants
  seed: 1
  n_envs: 8                        # 8 parallel collectors on 16-core box

env:
  episode_s: 300
  include_restfulness: false

reward:
  variant: full_shaped

mlflow:
  experiment_name: reward_ablation_5min
