# Reward ablation: NAIVE α-power maximisation.
#
# The proposal's original "α desync" idea, "maximise α". Has only one term - raw α band power.
#
# Run via:
#   biolistener-sleep train --config configs/ablation_naive_alpha_max.yaml \
#     --set training.seed=<N>

training:
  total_steps: 300000              # 250 episodes per seed; matched to the
                                   # other variants
  episode_s: 300                   # simulated seconds, not clock-calibrated
  learning_rate: 3.0e-4
  batch_size: 128
  buffer_size: 150000              # 50 % of the budget, as for every variant
  seed: 1
  n_envs: 8                        # SubprocVecEnv - 8 parallel collectors on 16-core box

env:
  episode_s: 300
  include_restfulness: false       # faster - skip MLModel call during ablation

reward:
  variant: naive_alpha_max

mlflow:
  experiment_name: reward_ablation_5min
